<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Explorer browser smoke test</title>
<pre id="result">RUNNING</pre>
<iframe id="explorer" title="Run Explorer" src="/" style="width:320px;height:900px;border:0"></iframe>
<script>
"use strict";
const result = document.getElementById("result");
const frame = document.getElementById("explorer");
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
async function until(test) {
  for (let attempt = 0; attempt < 60; attempt++) {
    if (test()) return;
    await wait(50);
  }
  throw new Error("Explorer did not reach the expected state");
}
function assert(condition, message) {
  if (!condition) throw new Error(message);
}
async function run() {
  await until(() => frame.contentDocument?.getElementById("count")?.textContent === "2 of 2 Runs");
  const doc = frame.contentDocument;
  assert(doc.getElementById("overview").textContent.includes("2 archived Runs"), "initial data did not load");

  const search = doc.getElementById("search");
  search.value = "first-run";
  search.dispatchEvent(new Event("input"));
  assert(doc.getElementById("count").textContent === "1 of 2 Runs", "search did not filter Runs");
  search.value = "";
  search.dispatchEvent(new Event("input"));
  const backend = doc.getElementById("backend");
  backend.value = "alternate";
  backend.dispatchEvent(new Event("change"));
  assert(doc.getElementById("count").textContent === "1 of 2 Runs", "backend filter did not filter Runs");
  assert(doc.querySelector('input[aria-label="Select first-run for comparison"]').closest("tr").hidden,
    "backend filter returned the wrong Run");
  backend.value = "";
  backend.dispatchEvent(new Event("change"));

  doc.querySelector('input[aria-label="Select first-run for comparison"]').closest("tr").querySelector(".run-link").click();
  assert(doc.getElementById("detail").open && doc.getElementById("detail-content").textContent.includes("first-run"),
    "Run detail dialog did not open");
  const hardwareDetail = doc.getElementById("detail-content").textContent;
  assert(hardwareDetail.includes("Intel Core i7-13700KF") && hardwareDetail.includes("DDR5") &&
    hardwareDetail.includes("Original hardware source") && hardwareDetail.includes("declared") &&
    hardwareDetail.includes("Operator-confirmed fields") && hardwareDetail.includes("cpu, memory_type, ram_gb"),
    "operator-confirmed hardware detail is missing");
  doc.querySelector("#detail form button").click();
  for (const id of ["first-run", "second-run"]) {
    doc.querySelector('input[aria-label="Select ' + id + ' for comparison"]').click();
  }
  doc.getElementById("compare").click();
  const comparison = doc.getElementById("detail-content").textContent;
  assert(doc.getElementById("detail").open && comparison.includes("Score") &&
    comparison.includes("0.8") && comparison.includes("0.6"), "compatible score comparison failed");
  doc.querySelector("#detail form button").click();

  const picker = doc.getElementById("snapshot");
  await until(() => [...picker.options].some(option => option.value === "2026-01-01-0123456789ab"));
  picker.value = "2026-01-01-0123456789ab";
  picker.dispatchEvent(new Event("change"));
  await until(() => doc.getElementById("count").textContent === "1 of 1 Runs");
  assert(doc.getElementById("runs").textContent.includes("historical-run"), "historical snapshot did not load");
  doc.querySelector(".run-link").click();
  assert(doc.getElementById("detail-content").textContent.includes("Operator-confirmed fieldsUnknown"),
    "legacy snapshot hardware provenance should remain unknown");
  doc.querySelector("#detail form button").click();
  picker.value = "";
  picker.dispatchEvent(new Event("change"));
  await until(() => doc.getElementById("count").textContent === "2 of 2 Runs");

  const viewport = frame.contentWindow;
  assert(viewport.innerWidth === 320, "browser was not started at a 320px viewport");
  assert(viewport.matchMedia("(max-width: 530px)").matches, "mobile layout breakpoint is not active");
  assert(viewport.document.documentElement.scrollWidth <= viewport.document.documentElement.clientWidth,
    "Explorer overflows horizontally at 320px");
  assert(viewport.getComputedStyle(viewport.document.querySelector(".run-table tbody")).display === "grid",
    "mobile Run cards are not displayed");
  result.textContent = "PASS";
}
run().catch(error => {
  result.textContent = "FAIL: " + error.message;
});
</script>
</html>
